# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

# 旧的独立红队包（dsh-redteam-store / -ui / -mode / -mode/store / -mode/ui）已不再分发，
# 这里原先有 5 条 `- id: … / disabled: true` 的防御性覆盖项。宿主对「id 不存在」的覆盖项
# 每次启动都会 warn `patch: entry not found` 然后跳过（cordis-plugin-include L253–256），
# 既不会创建行、也不会生效，只留噪音，故整段删除。若将来真的重新装这些包，按需在
# 用户层 profile 里自行关闭即可。

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: ""

# 本体行（dsh-purge-profile）只由用户层 profile/cordis.patch.yml 的 insert 提供，
# 这里不再写同 id 的 overlay：宿主的插件开关按行 id 往用户层写
# `- id: <id> / disabled: true|false`，两层共用同一个 id 时，关一次会连 overlay 一起关掉，
# 表现成插件被自己关掉、UI 静默消失（#152 / #154 / #159 / #192）。
# 本体行的 inject/config 现由 insert 自身携带，见 lib/profile-insert.js 的 INSERT_BLOCK。

- insert:
    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
